<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020"><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#475569" /></marker></defs><rect width="1600" height="1020" fill="white" /><text x="50" y="35" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="start"><tspan x="50" dy="0">01. Hibabejelentés és lezárás</tspan></text><rect x="40" y="60" width="1520" height="240" rx="8" fill="#eaf1fb" stroke="#94a3b8" /><text x="55" y="82" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="start"><tspan x="55" dy="0">ADMIN</tspan></text><rect x="40" y="340" width="1520" height="250" rx="8" fill="#eaf7f1" stroke="#94a3b8" /><text x="55" y="362" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="start"><tspan x="55" dy="0">FELHASZNÁLÓ</tspan></text><rect x="40" y="620" width="1520" height="370" rx="8" fill="#fff5e8" stroke="#94a3b8" /><text x="55" y="642" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="start"><tspan x="55" dy="0">BACKEND</tspan></text><rect x="90" y="390" width="220" height="85" rx="8" fill="white" stroke="#64748b" /><text x="200.0" y="429.5" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="200.0" dy="0">Hibaleírás megadása</tspan><tspan x="200.0" dy="19">Beküldés gomb</tspan></text><rect x="400" y="390" width="220" height="85" rx="8" fill="white" stroke="#64748b" /><text x="510.0" y="429.5" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="510.0" dy="0">Sikerüzenet + Id</tspan><tspan x="510.0" dy="19">A leírás kiürül</tspan></text><rect x="400" y="505" width="220" height="65" rx="8" fill="white" stroke="#64748b" /><text x="510.0" y="534.5" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="510.0" dy="0">Hibaüzenet (piros)</tspan><tspan x="510.0" dy="19">A leírás megmarad</tspan></text><rect x="720" y="110" width="200" height="75" rx="8" fill="white" stroke="#64748b" /><text x="820.0" y="144.5" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="820.0" dy="0">Lista frissítése</tspan><tspan x="820.0" dy="19">Az admin indítja</tspan></text><rect x="980" y="110" width="230" height="80" rx="8" fill="white" stroke="#64748b" /><text x="1095.0" y="147.0" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="1095.0" dy="0">Id, leírás, állapot</tspan><tspan x="1095.0" dy="19">Lezárás csak nyitott sorban</tspan></text><rect x="1260" y="110" width="230" height="75" rx="8" fill="white" stroke="#64748b" /><text x="1375.0" y="154.5" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="1375.0" dy="0">Lezárás gomb</tspan></text><rect x="1260" y="220" width="230" height="60" rx="8" fill="white" stroke="#64748b" /><text x="1375.0" y="247.0" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="1375.0" dy="0">Lezárva állapot</tspan><tspan x="1375.0" dy="19">A gomb eltűnik</tspan></text><rect x="90" y="690" width="220" height="100" rx="8" fill="white" stroke="#64748b" /><text x="200.0" y="737.0" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="200.0" dy="0">Trim után 1–1000 karakter</tspan><tspan x="200.0" dy="19">Mentés: IsClosed = false</tspan></text><rect x="730" y="690" width="220" height="100" rx="8" fill="white" stroke="#64748b" /><text x="840.0" y="727.0" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="840.0" dy="0">Bejelentések lekérése</tspan><tspan x="840.0" dy="19">Legújabb Id elöl</tspan><tspan x="840.0" dy="19">Üres lista is sikeres</tspan></text><rect x="1260" y="690" width="230" height="100" rx="8" fill="white" stroke="#64748b" /><text x="1375.0" y="727.0" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="1375.0" dy="0">Rekord megkeresése</tspan><tspan x="1375.0" dy="19">IsClosed = true mentése</tspan><tspan x="1375.0" dy="19">Újra lezárható: 200 OK</tspan></text><rect x="90" y="860" width="1400" height="105" rx="8" fill="white" stroke="#64748b" /><text x="790.0" y="889.5" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="790.0" dy="0">REST ÉS MEGSZORÍTÁSOK</tspan><tspan x="790.0" dy="19">Hibás leírás: 400. Ismeretlen rekord lezárása: 404. Hibák: ProblemDetails.detail + code.</tspan><tspan x="790.0" dy="19">A lezárt sor megmarad. Nincs újranyitás, törlés vagy azonosítás.</tspan><tspan x="790.0" dy="19">InMemory: a backend újraindításakor minden bejelentés és lezárás törlődik.</tspan></text><polyline points="200,475 200,690" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="105.0" y="569.0" width="190" height="42" rx="3" fill="white" opacity="0.98" /><text x="200" y="586" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle"><tspan x="200" dy="0">POST /reports</tspan><tspan x="200" dy="17">{ description }</tspan></text><polyline points="310,720 650,720 650,435 620,435" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="535.0" y="614.0" width="230" height="42" rx="3" fill="white" opacity="0.98" /><text x="650" y="631" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle"><tspan x="650" dy="0">201 Created</tspan><tspan x="650" dy="17">{ id, description, isClosed }</tspan></text><polyline points="310,760 355,760 355,537 400,537" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="275.0" y="629.0" width="160" height="42" rx="3" fill="white" opacity="0.98" /><text x="355" y="646" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle"><tspan x="355" dy="0">400 Bad Request</tspan><tspan x="355" dy="17">ProblemDetails</tspan></text><polyline points="510,390 510,270 820,270 820,185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="580.0" y="242.5" width="190" height="25" rx="3" fill="white" opacity="0.98" /><text x="675" y="259" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle"><tspan x="675" dy="0">Admin kézi frissítése</tspan></text><polyline points="820,185 820,690" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="750.0" y="387.5" width="140" height="25" rx="3" fill="white" opacity="0.98" /><text x="820" y="404" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle"><tspan x="820" dy="0">GET /reports</tspan></text><polyline points="950,740 1095,740 1095,190" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="1010.0" y="424.0" width="170" height="42" rx="3" fill="white" opacity="0.98" /><text x="1095" y="441" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle"><tspan x="1095" dy="0">200 OK</tspan><tspan x="1095" dy="17">Bejelentések listája</tspan></text><polyline points="1210,150 1260,150" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="1140.0" y="190.5" width="190" height="25" rx="3" fill="white" opacity="0.98" /><text x="1235" y="207" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle"><tspan x="1235" dy="0">Nyitott sor kiválasztása</tspan></text><polyline points="1290,185 1240,185 1240,740 1260,740" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="1152.5" y="364.0" width="175" height="42" rx="3" fill="white" opacity="0.98" /><text x="1240" y="381" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle"><tspan x="1240" dy="0">POST</tspan><tspan x="1240" dy="17">/reports/{id}/close</tspan></text><polyline points="1470,690 1470,280" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="1390.0" y="524.0" width="160" height="42" rx="3" fill="white" opacity="0.98" /><text x="1470" y="541" fill="#172b4d" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle"><tspan x="1470" dy="0">200 OK</tspan><tspan x="1470" dy="17">Frissített listaelem</tspan></text></svg>